[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maelstrom"
version = "0.1.0"
description = "A 'plays like me' chess bot: personalised human-move model on a frozen Maia base."
requires-python = ">=3.10"
dependencies = [
  "chess>=1.11", "pandas>=2.2", "pyarrow>=15", "numpy>=1.26",
  "requests>=2.31", "pyyaml>=6", "tqdm>=4.66", "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
model = ["torch>=2.2"]

[project.scripts]
maelstrom-export-lichess = "maelstrom.data.export_lichess:main"
maelstrom-export-chesscom = "maelstrom.data.export_chesscom:main"
maelstrom-parse = "maelstrom.data.parse:main"
maelstrom-split = "maelstrom.data.split:main"
maelstrom-annotate = "maelstrom.annotate.stockfish:main"
maelstrom-eda = "maelstrom.analysis.eda:main"
maelstrom-baselines = "maelstrom.eval.baselines:main"
maelstrom-stockfish-baseline = "maelstrom.eval.stockfish_baseline:main"
maelstrom-adapter = "maelstrom.models.adapter:main"
maelstrom-maia3-features = "maelstrom.models.maia3_features:main"

[tool.setuptools.packages.find]
include = ["maelstrom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
