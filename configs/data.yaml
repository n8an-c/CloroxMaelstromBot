# Copy to configs/local.yaml (git-ignored) and fill in your usernames.
players:
  lichess: null        # e.g. "YourLichessName"
  chesscom: null       # e.g. "YourChesscomName"

# Which speeds to keep. Lichess perfTypes / Chess.com time classes.
perf_types: [blitz, rapid]

# Chess.com -> Lichess-equivalent rating mapping (approximate; tune in Phase 1).
# Applied as lichess = a * chesscom + b, per speed.
rating_map:
  blitz:  {a: 1.0, b: 250}
  rapid:  {a: 1.0, b: 200}
  bullet: {a: 1.0, b: 300}
  classical: {a: 1.0, b: 150}

split:
  test_frac: 0.10     # most recent games -> temporal test set
  val_frac: 0.10      # random fraction of the remainder -> validation
  seed: 20260101

stockfish:
  path: tools/stockfish/stockfish-ubuntu-x86-64-avx2
  depth: 13
  threads: 1
  hash_mb: 64
  workers: 4
  user_moves_only: true
